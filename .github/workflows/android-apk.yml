name: Build MadelineProto HTTPS Android APK
# Build the APK on the GitHub runner without booting an Android emulator.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project overlay
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, filter, gd, gmp, iconv, mbstring, openssl, sockets, xml, zlib, zip
          coverage: none

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Laravel installer
        run: |
          composer global require laravel/installer
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.config/composer/vendor/bin" >> "$GITHUB_PATH"

      - name: Create NativePHP starter app
        run: |
          laravel new nativephp-build --using=nativephp/mobile-starter --dev --no-node --no-boost --force --no-interaction
          cp nativephp-app/app/NativeComponents/Home.php nativephp-build/app/NativeComponents/Home.php
          mkdir -p nativephp-build/app/Services
          cp nativephp-app/app/Services/MadelineTelegram.php nativephp-build/app/Services/MadelineTelegram.php
          cp nativephp-app/resources/views/native/home.blade.php nativephp-build/resources/views/native/home.blade.php

      - name: Install MadelineProto and document picker
        working-directory: nativephp-build
        run: |
          composer require danog/madelineproto:^8.0 smronju/nativephp-document-picker --no-interaction
          php artisan native:plugin:register smronju/nativephp-document-picker
          php artisan native:plugin:list

      - name: Configure Android app
        working-directory: nativephp-build
        run: |
          php artisan key:generate --force
          cat >> .env <<'EOF'
          NATIVEPHP_APP_ID=com.soebb.madelinehttps.test
          NATIVEPHP_APP_VERSION=DEBUG
          NATIVEPHP_APP_VERSION_CODE=1
          NATIVEPHP_ANDROID_MIN_SDK=26
          NATIVEPHP_ANDROID_COMPILE_SDK=36
          NATIVEPHP_ANDROID_TARGET_SDK=36
          EOF

      - name: Install NativePHP Android shell
        working-directory: nativephp-build
        run: |
          printf 'n\n' | php artisan native:install android --force
          test -f nativephp/android/app/build.gradle.kts

      - name: Resolve NativePHP Gradle template placeholders
        working-directory: nativephp-build
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="nativephp/android/app/build.gradle.kts"
          sed -i \
            -e 's/REPLACE_COMPILE_SDK/36/g' \
            -e 's/REPLACE_MIN_SDK/26/g' \
            -e 's/REPLACE_TARGET_SDK/36/g' \
            -e 's/REPLACEMECODE/1/g' \
            -e 's/REPLACE_MINIFY_ENABLED/false/g' \
            -e 's/REPLACE_SHRINK_RESOURCES/false/g' \
            "$gradle_file"
          if grep -Eq 'REPLACE_|REPLACEMECODE' "$gradle_file"; then
            echo "::error::Unresolved NativePHP Gradle placeholders remain."
            grep -nE 'REPLACE_|REPLACEMECODE' "$gradle_file"
            exit 1
          fi
          echo "Android Gradle configuration:"
          sed -n '1,28p' "$gradle_file"

      - name: Build debug APK directly with Gradle
        working-directory: nativephp-build
        shell: bash
        run: |
          set -euo pipefail
          cd nativephp/android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK successfully generated:"
          ls -lh "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MadelineProto-HTTPS-Test-debug
          path: nativephp-build/nativephp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
